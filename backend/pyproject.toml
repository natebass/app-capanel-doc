[project]
name = "app"
version = "1.0.1"
description = "Sphinx documentation for the California Accountability Panel website."
requires-python = ">=3.14,<4.0"
dependencies = [
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "tenacity==9.1.4",
    "pydantic==2.13.5",
    "emails==1.1.2",
    "jinja2==3.1.6",
    "alembic==1.19.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "sqlmodel==0.0.42",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "pandas==3.0.5",
    "openpyxl==3.1.5",
    "chardet==7.6.0",
    "boto3==1.43.83",
    "google-auth==2.57.0",
    "sphinx==9.1.0",
    "sphinx-autodoc-typehints==3.13.4",
    "sphinx-autobuild==2025.8.25",
    "pydata-sphinx-theme==0.21.0",
    "docutils-stubs==0.0.22",
    "types-docutils==0.23.0.20260827",
    "myst-parser==5.1.0",
    "sphinx-design==0.7.0",
    "sphinxcontrib-mermaid==2.1.0",
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "sentry-sdk>=2.68.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
    "coverage==7.16.0",
    "ty==0.0.77",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "T201",  # Allow print statements
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"
