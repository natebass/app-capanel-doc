[project]
name = "app"
version = "1.0.1"
description = "Sphinx documentation for the California Accountability Panel website."
requires-python = ">=3.14,<4.0"
dependencies = [
    "python-multipart",
    "email-validator",
    "tenacity",
    "pydantic",
    "emails",
    "jinja2",
    "alembic",
    "httpx",
    "psycopg[binary]",
    "sqlmodel",
    "pydantic-settings",
    "pyjwt",
    "pwdlib[argon2,bcrypt]",
    "pandas",
    "openpyxl",
    "chardet",
    "google-auth",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-autobuild",
    "pydata-sphinx-theme",
    "docutils-stubs",
    "types-docutils",
    "myst-parser",
    "sphinx-design",
    "sphinxcontrib-mermaid",
    "psycopg2-binary",
    "fastapi[standard-no-fastapi-cloud-cli]",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "prek",
    "coverage",
    "types-psycopg2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "T201",  # Allow print statements
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
